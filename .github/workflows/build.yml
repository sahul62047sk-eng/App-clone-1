name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate App Files and Build APK
        run: |
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/java/com/example/safecloner

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SafeCloner"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.safecloner'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.safecloner"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

              <application
                  android:allowBackup="true"
                  android:fullBackupContent="true"
                  android:label="SafeCloner"
                  android:theme="@style/Theme.MaterialComponents.DayNight.DarkActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".MyDeviceAdminReceiver"
                      android:permission="android.permission.BIND_DEVICE_ADMIN"
                      android:exported="true">
                      <meta-data
                          android:name="android.app.device_admin"
                          android:resource="@xml/device_admin" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                          <action android:name="android.app.action.PROFILE_PROVISIONING_COMPLETE" />
                      </intent-filter>
                  </receiver>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/device_admin.xml
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock />
              </uses-policies>
          </device-admin>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/safecloner/MainActivity.kt
          package com.example.safecloner

          import android.app.admin.DeviceAdminReceiver
          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MyDeviceAdminReceiver : DeviceAdminReceiver() {
              override fun onProfileProvisioningComplete(context: Context, intent: Intent) {
                  val dpm = context.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                  val adminComponent = ComponentName(context, MyDeviceAdminReceiver::class.java)

                  dpm.setProfileName(adminComponent, "SafeClone Space")
                  dpm.setProfileEnabled(adminComponent)

                  Toast.makeText(context, "Clone Space Ready! Kuchh delete nahi hoga.", Toast.LENGTH_LONG).show()
              }
          }

          class MainActivity : AppCompatActivity() {

              private lateinit var dpm: DevicePolicyManager
              private lateinit var adminComponent: ComponentName

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  dpm = getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                  adminComponent = ComponentName(this, MyDeviceAdminReceiver::class.java)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 64, 48, 48)
                  }

                  val statusText = TextView(this).apply {
                      textSize = 16f
                      text = if (dpm.isProfileOwnerApp(packageName)) {
                          "Status: Aap Clone Space ke andar hain. Yahan ke sabhi apps aur data 100% isolated aur safe hain."
                      } else {
                          "Status: Main Phone. Sabhi apps ka clone banane ke liye neeche button dabayein."
                      }
                  }

                  val btnCreateCloneSpace = Button(this).apply {
                      text = "1. Create Clone Space (All Apps)"
                      setOnClickListener { startWorkProfileProvisioning() }
                  }

                  val btnAntiUninstall = Button(this).apply {
                      text = "2. Enable Anti-Uninstall Lock"
                      setOnClickListener { enableAntiUninstall() }
                  }

                  val btnEnableApps = Button(this).apply {
                      text = "3. Enable Play Store in Clone Space"
                      setOnClickListener {
                          if (dpm.isProfileOwnerApp(packageName)) {
                              enableSystemAppsInClone()
                          } else {
                              Toast.makeText(this@MainActivity, "Pehle Clone Space banayein aur uske andar se ye app kholein", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }

                  layout.addView(statusText)
                  layout.addView(btnCreateCloneSpace)
                  layout.addView(btnAntiUninstall)
                  layout.addView(btnEnableApps)
                  setContentView(layout)
              }

              private fun startWorkProfileProvisioning() {
                  val intent = Intent(DevicePolicyManager.ACTION_PROVISION_MANAGED_PROFILE).apply {
                      putExtra(DevicePolicyManager.EXTRA_PROVISIONING_DEVICE_ADMIN_COMPONENT_NAME, adminComponent)
                  }
                  if (intent.resolveActivity(packageManager) != null) {
                      startActivityForResult(intent, 101)
                  } else {
                      Toast.makeText(this, "Aapke phone mein Work Profile support disabled hai", Toast.LENGTH_LONG).show()
                  }
              }

              private fun enableAntiUninstall() {
                  if (!dpm.isAdminActive(adminComponent)) {
                      val intent = Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN).apply {
                          putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, adminComponent)
                          putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION, "Isse aapka cloner app aur data galti se delete nahi hoga.")
                      }
                      startActivity(intent)
                  } else {
                      Toast.makeText(this, "Anti-Uninstall pehle se ON hai!", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun enableSystemAppsInClone() {
                  val packagesToEnable = listOf("com.android.vending", "com.android.chrome")
                  packagesToEnable.forEach { pkg ->
                      try {
                          dpm.enableSystemApp(adminComponent, pkg)
                      } catch (_: Exception) { }
                  }
                  Toast.makeText(this, "Clone Space mein Play Store aur Chrome activate ho gaye!", Toast.LENGTH_LONG).show()
              }
          }
          EOF

          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SafeCloner-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
