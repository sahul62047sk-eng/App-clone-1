name: Build Clone Hub Pro (Ad-Free)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install NDK and CMake for Virtual Engine
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529" "cmake;3.18.1"

      - name: Clone and Patch Virtual Sandbox Engine
        run: |
          git clone --depth 1 https://github.com/CodingGay/BlackBox.git clonehub
          cd clonehub
          printf "sdk.dir=%s\nndk.dir=%s/ndk/21.4.7075529\n" "$ANDROID_HOME" "$ANDROID_HOME" > local.properties
          find . -name "*.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
          sed -i 's/mavenCentral()/mavenCentral()\n        maven { url "https:\/\/jitpack.io" }/g' build.gradle
          sed -i 's/BlackBox/Clone Hub Pro/g' app/src/main/res/values/strings.xml || true
          chmod +x gradlew
          ./gradlew assembleDebug -x lint

      - name: Upload Ad-Free Clone Hub APK
        uses: actions/upload-artifact@v4
        with:
          name: CloneHub-Pro-AdFree
          path: clonehub/app/build/outputs/apk/debug/*.apk
          
